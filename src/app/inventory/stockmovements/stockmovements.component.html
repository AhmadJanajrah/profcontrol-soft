<!-- Page header with title and breadcrumbs -->
<div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2 mb-0">
    <div>
        <h1 class="page-title">
            {{ app.localize('Stock Movements') }}
        </h1>
        <nav>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item icon">
                    <a [routerLink]="['/']" [appTooltip]="app.localize('Home')">
                        <i class="ri-home-4-line"></i>
                    </a>
                </li>
                <li class="breadcrumb-item">
                    {{ app.localize('Inventory') }}
                </li>
                <li class="breadcrumb-item active">
                    {{ app.localize('Stock Movements') }}
                </li>
            </ol>
        </nav>
    </div>
</div>

<div class="main-content">
    <!-- Filters section -->
    <div class="card mb-2">
        <div class="card-body">
            <form
                #filterForm="ngForm"
                [ngClass]="{ 'was-validated': filters.validated }"
                (ngSubmit)="applyFilters(filterForm)"
                novalidate>
                <div class="d-flex align-items-end gap-3 flex-wrap filter-bar">
                    <!-- Start Date filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 180px">
                        <label for="dateFrom" class="form-label">
                            {{ app.localize('From Date') }}
                        </label>
                        <div class="input-with-icon">
                            <input
                                [(ngModel)]="filters.dateFrom"
                                type="date"
                                name="dateFrom"
                                id="dateFrom"
                                onclick="this.showPicker()"
                                class="form-control" />
                            @if (filters.dateFrom) {
                            <button
                                (click)="filters.dateFrom = null"
                                type="button"
                                class="input-icon-end"
                                tabindex="-1">
                                <i class="ri-close-line"></i>
                            </button>
                            }
                        </div>
                    </div>

                    <!-- End Date filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 180px">
                        <label for="dateTo" class="form-label">
                            {{ app.localize('To Date') }}
                        </label>
                        <div class="input-with-icon">
                            <input
                                [(ngModel)]="filters.dateTo"
                                type="date"
                                name="dateTo"
                                id="dateTo"
                                onclick="this.showPicker()"
                                class="form-control" />
                            @if (filters.dateTo) {
                            <button (click)="filters.dateTo = null" type="button" class="input-icon-end" tabindex="-1">
                                <i class="ri-close-line"></i>
                            </button>
                            }
                        </div>
                    </div>

                    <!-- Movement Type filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 200px">
                        <label for="filterMovementType" class="form-label">
                            {{ app.localize('Movement Type') }}
                        </label>
                        <ng-select
                            [(ngModel)]="filters.movementType"
                            [items]="movementTypes"
                            bindLabel="label"
                            bindValue="value"
                            id="filterMovementType"
                            name="filterMovementType"
                            [clearable]="true"
                            placeholder="{{ app.localize('All') }}"
                            class="form-control"
                            appendTo="body">
                            <ng-template ng-option-tmp let-item="item">
                                <i class="{{ item.icon }}"></i>
                                {{ item.label }}
                            </ng-template>
                        </ng-select>
                    </div>

                    <!-- Filter actions -->
                    <div class="d-flex flex-grow-1 align-items-end gap-2 flex-shrink-0">
                        <button
                            [ngClass]="{ 'disabled btn-progress': filters.submitted }"
                            [disabled]="filters.submitted"
                            type="submit"
                            class="btn btn-primary btn-round">
                            <i class="ri-filter-3-line me-1"></i>
                            {{ app.localize('Apply') }}
                        </button>
                        <button
                            (click)="resetFilters()"
                            type="button"
                            [disabled]="filters.submitted"
                            class="btn btn-light btn-round">
                            <i class="ri-refresh-line me-1"></i>
                            {{ app.localize('Reset') }}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Stock Movements DataTable -->
    <div class="card">
        <div class="card-body py-2">
            <div class="table-responsive">
                <table [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" datatable class="table" id="dataTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
