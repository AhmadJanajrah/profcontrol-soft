<!-- Page header with title and navigation -->
<div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2 mb-0">
    <div>
        <h1 class="page-title">
            {{ app.localize('Users') }}
        </h1>
        <nav>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item icon">
                    <a [routerLink]="['/']" [appTooltip]="app.localize('Home')">
                        <i class="ri-home-4-line"></i>
                    </a>
                </li>
                <li class="breadcrumb-item active">
                    {{ app.localize('Users') }}
                </li>
            </ol>
        </nav>
    </div>
    <!-- Add new user button -->
    <div class="float-end">
        @if (permissions.canAdd) {
        <a [routerLink]="['/users/add']" class="btn btn-primary btn-round">
            <i class="ri-add-line"></i>
            {{ app.localize('Add New') }}
        </a>
        }
    </div>
</div>

<div class="main-content">
    <!-- Filters section -->
    <div class="card mb-2">
        <div class="card-body">
            <form
                #filterForm="ngForm"
                [ngClass]="{ 'was-validated': filters.validated }"
                (ngSubmit)="applyFilters(filterForm)"
                novalidate>
                <div class="d-flex align-items-end gap-3 flex-wrap filter-bar">
                    <!-- Role filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 220px">
                        <label class="form-label" for="roleSelect">
                            {{ app.localize('Role') }}
                        </label>
                        <ng-select
                            [(ngModel)]="filters.roleId"
                            [items]="roles"
                            bindLabel="roleName"
                            bindValue="id"
                            id="roleSelect"
                            name="roleSelect"
                            [clearable]="true"
                            [placeholder]="app.localize('All')"
                            class="form-control"
                            appendTo="body"></ng-select>
                    </div>

                    <!-- Status filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 220px">
                        <label class="form-label" for="statusSelect">
                            {{ app.localize('Status') }}
                        </label>
                        <ng-select
                            [(ngModel)]="filters.status"
                            [items]="statusOptions"
                            bindLabel="label"
                            bindValue="value"
                            id="statusSelect"
                            name="statusSelect"
                            [clearable]="true"
                            [placeholder]="app.localize('All')"
                            class="form-control"
                            appendTo="body"></ng-select>
                    </div>

                    <!-- Filter actions -->
                    <div class="d-flex align-items-end gap-2 flex-grow-1">
                        <button
                            [ngClass]="{ 'disabled btn-progress': filters.submitted }"
                            [disabled]="filters.submitted"
                            type="submit"
                            class="btn btn-primary btn-round">
                            <i class="ri-filter-3-line me-1"></i>
                            {{ app.localize('Apply') }}
                        </button>
                        <button
                            (click)="resetFilters()"
                            type="button"
                            [disabled]="filters.submitted"
                            class="btn btn-light btn-round">
                            <i class="ri-refresh-line me-1"></i>
                            {{ app.localize('Reset') }}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Users data table -->
    <div class="card">
        <div class="card-body py-2">
            <table [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" datatable class="table" id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
