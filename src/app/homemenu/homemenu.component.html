<div class="main-content">
    <!-- Welcome Section -->
    <div class="welcome-section text-center mb-4">
        <div class="welcome-avatar mb-3">
            <img
                [src]="getUserImage()"
                [alt]="getUserName()"
                class="rounded-circle"
                width="100"
                height="100"
                onerror="this.src='assets/images/user.png'" />
        </div>
        <h2 class="welcome-title mb-2">{{ getGreeting() }}, {{ getUserName() }}!</h2>
        <p class="welcome-subtitle text-muted">{{ app.localize('Welcome Back') }}</p>
    </div>

    <!-- Quick Access Menus -->
    @if (quickAccessMenus.length > 0) {
    <div class="quick-access-section p-2 p-md-3">
        <h5 class="section-title mb-3">{{ app.localize('Quick Access') }}</h5>
        <div class="row g-3">
            @for (menu of quickAccessMenus; track menu.route) {
            <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                <div
                    class="quick-menu-card card h-100 text-center"
                    (click)="navigateTo(menu.route)"
                    role="button"
                    tabindex="0"
                    [attr.aria-label]="app.localize(menu.title)">
                    <div class="card-body p-3">
                        <div class="menu-icon mb-2" [class]="'bg-' + menu.color">
                            <i [class]="menu.icon"></i>
                        </div>
                        <h6 class="menu-title mb-0">{{ app.localize(menu.title) }}</h6>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
    }
</div>
