<!-- Page header with title and breadcrumbs -->
<div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2 mb-0">
    <div>
        <h1 class="page-title">
            {{ app.localize('Employees') }}
        </h1>
        <nav>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item icon">
                    <a [routerLink]="['/']" [appTooltip]="app.localize('Home')">
                        <i class="ri-home-4-line"></i>
                    </a>
                </li>
                <li class="breadcrumb-item">
                    {{ app.localize('HRM') }}
                </li>
                <li class="breadcrumb-item active">
                    {{ app.localize('Employees') }}
                </li>
            </ol>
        </nav>
    </div>
    <div class="float-end">
        <!-- Add new employee button -->
        <button (click)="addEmployee()" type="button" class="btn btn-primary btn-round">
            <i class="ri-add-line"></i>
            {{ app.localize('Add New') }}
        </button>
    </div>
</div>

<div class="main-content">
    <!-- Filters Card -->
    <div class="card mb-2">
        <div class="card-body">
            <form
                #filterForm="ngForm"
                [ngClass]="{ 'was-validated': filters.validated }"
                (ngSubmit)="applyFilters(filterForm)"
                novalidate>
                <div class="d-flex align-items-end gap-3 flex-wrap filter-bar">
                    <!-- Department filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 220px">
                        <label class="form-label">{{ app.localize('Department') }}</label>
                        <ng-select
                            [(ngModel)]="filters.departmentId"
                            [items]="departments"
                            bindLabel="departmentName"
                            bindValue="id"
                            [clearable]="true"
                            name="departmentId"
                            placeholder="{{ app.localize('All') }}"
                            class="form-control"
                            appendTo="body"></ng-select>
                    </div>

                    <!-- Designation filter -->
                    <div class="form-group flex-grow-1 mb-0" style="min-width: 220px">
                        <label class="form-label">{{ app.localize('Designation') }}</label>
                        <ng-select
                            [(ngModel)]="filters.designationId"
                            [items]="designations"
                            bindLabel="designationName"
                            bindValue="id"
                            [clearable]="true"
                            name="designationId"
                            placeholder="{{ app.localize('All') }}"
                            class="form-control"
                            appendTo="body"></ng-select>
                    </div>

                    <!-- Filter actions -->
                    <div class="flex-grow-1 d-flex align-items-end gap-2 flex-shrink-0">
                        <button
                            [ngClass]="{ 'disabled btn-progress': filters.submitted }"
                            [disabled]="filters.submitted"
                            type="submit"
                            class="btn btn-primary btn-round">
                            <i class="ri-filter-3-line me-1"></i>
                            {{ app.localize('Apply') }}
                        </button>
                        <button
                            (click)="clearFilters()"
                            type="button"
                            [disabled]="filters.submitted"
                            class="btn btn-light btn-round">
                            <i class="ri-refresh-line me-1"></i>
                            {{ app.localize('Clear') }}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Employees Table -->
    <div class="card">
        <div class="card-body py-2">
            <table [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" datatable class="table" id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
